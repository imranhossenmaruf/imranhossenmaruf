name: WakaTime Stats Sync

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ঘণ্টায় আপডেট হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # এখানে GITHUB_TOKEN এর বদলে GH_TOKEN ব্যবহার করুন
          SHOW_PROFILE_VIEWS: "false"
          # SHOW_TITLE লাইনটি এখান থেকে সরিয়ে ফেলা হয়েছে কারণ এটি এখন ইনভ্যালিড
          SHOW_SHORT_INFO: "true"
          SHOW_TOTAL_CODE_TIME: "true"
          SHOW_LANGUAGE: "true"
          SHOW_EDITORS: "true"
          SHOW_PROJECTS: "true"
