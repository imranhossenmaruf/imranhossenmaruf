<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2030"/>
      <stop offset="100%" stop-color="#16161e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="860" height="280" rx="8" fill="url(#bg)" stroke="#7aa2f7" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#7aa2f7" font-family="Segoe UI,Arial">🗺️ Visitor World Map</text>

  <!-- World map simplified outline (major landmasses) -->
  <!-- North America -->
  <path d="M 80,85 L100,75 L130,72 L155,80 L165,100 L160,125 L145,145 L125,155 L105,150 L90,135 L75,110 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- Central America -->
  <path d="M 130,155 L145,155 L148,175 L135,185 L125,175 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- South America -->
  <path d="M 135,185 L160,182 L175,195 L185,225 L178,255 L160,265 L140,255 L125,230 L120,205 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- Europe -->
  <path d="M 350,65 L385,60 L400,70 L405,90 L395,100 L375,105 L355,100 L345,85 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- Africa -->
  <path d="M 360,110 L400,108 L420,125 L428,160 L420,205 L405,230 L380,235 L355,220 L342,190 L340,155 L348,125 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- Russia/North Asia -->
  <path d="M 420,50 L520,45 L600,55 L620,75 L580,85 L520,82 L460,80 L430,70 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- Middle East -->
  <path d="M 420,105 L465,100 L480,115 L475,135 L455,140 L425,130 L415,115 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- South Asia (highlighted - Bangladesh) -->
  <path d="M 530,105 L575,100 L595,115 L600,140 L580,155 L555,155 L535,140 L525,120 Z" fill="#2d4a7a" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.8" opacity="0.9"/>
  <!-- Southeast Asia -->
  <path d="M 595,115 L640,110 L665,125 L660,150 L635,155 L605,148 L595,135 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- East Asia -->
  <path d="M 610,65 L670,58 L710,70 L720,95 L695,110 L655,108 L620,100 L605,82 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>
  <!-- Australia -->
  <path d="M 650,195 L710,188 L745,200 L750,230 L730,250 L695,252 L660,240 L645,218 Z" fill="#1e3a5f" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.4" opacity="0.8"/>

  <!-- Visitor ping dots (animated) -->
  <!-- Bangladesh - Home base (bright) -->
  <circle cx="565" cy="128" r="5" fill="#ff9e64" filter="url(#glow)" opacity="0.9"/>
  <circle cx="565" cy="128" r="10" fill="none" stroke="#ff9e64" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="5;18;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- USA -->
  <circle cx="120" cy="110" r="4" fill="#7aa2f7" filter="url(#glow)" opacity="0.8"/>
  <circle cx="120" cy="110" r="8" fill="none" stroke="#7aa2f7" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="4;14;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- UK/Europe -->
  <circle cx="370" cy="80" r="3.5" fill="#bb9af7" filter="url(#glow)" opacity="0.8"/>
  <circle cx="370" cy="80" r="7" fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="3.5;12;3.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- India -->
  <circle cx="548" cy="135" r="3.5" fill="#9ece6a" filter="url(#glow)" opacity="0.8"/>
  <!-- Japan -->
  <circle cx="700" cy="85" r="3" fill="#e0af68" filter="url(#glow)" opacity="0.8"/>
  <!-- Australia -->
  <circle cx="695" cy="220" r="3" fill="#7aa2f7" filter="url(#glow)" opacity="0.7"/>
  <!-- Canada -->
  <circle cx="105" cy="82" r="2.5" fill="#bb9af7" opacity="0.6"/>
  <!-- Germany -->
  <circle cx="390" cy="72" r="2.5" fill="#7aa2f7" opacity="0.6"/>
  <!-- UAE -->
  <circle cx="462" cy="118" r="2.5" fill="#e0af68" opacity="0.6"/>
  <!-- Singapore -->
  <circle cx="638" cy="148" r="2.5" fill="#9ece6a" opacity="0.6"/>

  <!-- Legend -->
  <circle cx="50" cy="255" r="5" fill="#ff9e64" opacity="0.9"/>
  <text x="60" y="259" font-size="9" fill="#c0caf5" font-family="Segoe UI,Arial">Home (Bangladesh)</text>
  <circle cx="180" cy="255" r="4" fill="#7aa2f7" opacity="0.8"/>
  <text x="190" y="259" font-size="9" fill="#c0caf5" font-family="Segoe UI,Arial">Frequent visitors</text>
  <circle cx="310" cy="255" r="3" fill="#bb9af7" opacity="0.7"/>
  <text x="320" y="259" font-size="9" fill="#c0caf5" font-family="Segoe UI,Arial">Occasional visitors</text>

  <!-- Footer -->
  <text x="430" y="270" text-anchor="middle" font-size="8" fill="#565f89" font-family="Segoe UI,Arial">Global developer community · github.com/imranhossenmaruf</text>

  <!-- Ocean grid lines -->
  <line x1="20" y1="160" x2="840" y2="160" stroke="#7aa2f7" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="20" y1="200" x2="840" y2="200" stroke="#7aa2f7" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="240" y1="35" x2="240" y2="250" stroke="#7aa2f7" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="490" y1="35" x2="490" y2="250" stroke="#7aa2f7" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="740" y1="35" x2="740" y2="250" stroke="#7aa2f7" stroke-opacity="0.05" stroke-width="0.5"/>
</svg>